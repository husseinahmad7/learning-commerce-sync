name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: apptech-academic-sync-ci
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build and start services
        run: docker compose up --build --detach --wait --wait-timeout 120

      - name: Check migrations
        run: docker compose exec -T web python manage.py makemigrations --check --dry-run

      - name: Run PostgreSQL and Redis tests
        run: docker compose exec -T web python manage.py test --noinput -v 2

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100

      - name: Clean up
        if: always()
        run: docker compose down --volumes --remove-orphans
