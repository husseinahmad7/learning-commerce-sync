name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: learning-commerce-sync-ci
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build and start services
        run: docker compose up --build --detach --wait --wait-timeout 120

      - name: Check migrations
        run: docker compose exec -T web python manage.py makemigrations --check --dry-run

      - name: Run PostgreSQL and Redis tests
        run: docker compose exec -T web python manage.py test --noinput -v 2

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100

      - name: Clean up
        if: always()
        run: docker compose down --volumes --remove-orphans

  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:integration
