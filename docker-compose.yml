name: apptech-academic-sync-demo

x-app: &app
  image: localhost/apptech-academic-sync:dev
  build: .
  pull_policy: build
  environment:
    APP_MODE: demo
    DJANGO_SECRET_KEY: demo-only-not-a-production-secret
    DB_NAME: apptech
    DB_USER: apptech
    DB_PASSWORD: development-only
    DB_HOST: db
    CELERY_BROKER_URL: redis://redis:6379/0
    MOCK_ERP_URL: http://web:8000/mock-erp/sync/
    MOCK_ERP_RANDOM_FAILURES: "${MOCK_ERP_RANDOM_FAILURES:-true}"
  init: true
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777,nosuid,nodev,noexec
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 20s

services:
  db:
    image: docker.io/library/postgres:16-alpine@sha256:1a66d744c1b459e13b05a8fca341da84cb63383e99ce262210efee5a319d4551
    environment:
      POSTGRES_DB: apptech
      POSTGRES_USER: apptech
      POSTGRES_PASSWORD: development-only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apptech -d apptech"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: docker.io/library/redis:7.4.10@sha256:1feed93082d872fa051fb6b5787a247d39e9c0d00357404c3a6554ba5e4a5315
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    <<: *app
    ports:
      - "127.0.0.1:${APP_PORT:-18001}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "--hostname=worker@%h", "--loglevel=INFO", "--concurrency=2", "--pidfile=/tmp/worker.pid"]
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "scripts/health.py", "worker"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 20s

  beat:
    <<: *app
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--scheduler=config.scheduler:HeartbeatScheduler", "--schedule=/run/celery/schedule", "--pidfile=/run/celery/beat.pid"]
    tmpfs:
      - /tmp:size=64m,mode=1777,nosuid,nodev,noexec
      - /run/celery:size=8m,mode=1777,nosuid,nodev,noexec
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "scripts/health.py", "beat"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 15s

volumes:
  postgres-data:
